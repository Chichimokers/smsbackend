name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.11"
  DOCKER_IMAGE: smsproject
  
jobs:
  # =============================================================================
  # JOB 1: Lint & Type Check
  # =============================================================================
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 black isort
      
      - name: Run flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true
      
      - name: Check code formatting with black
        run: black --check --diff . || true
      
      - name: Check import order with isort
        run: isort --check-only --diff . || true

  # =============================================================================
  # JOB 2: Tests & Migrations
  # =============================================================================
  test:
    name: Tests & Migrations
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_smsproject
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov
      
      - name: Check Django configuration
        env:
          DEBUG: "True"
          SECRET_KEY: "test-secret-key-for-ci-only-not-production-use-min-50-chars"
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_smsproject
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          CACHE_URL: redis://localhost:6379/1
          MOCK_DAISY_SMS: "true"
          DAISY_SMS_API_KEY: "fake-key-for-testing"
        run: python manage.py check
      
      - name: Check for migration issues
        env:
          DEBUG: "True"
          SECRET_KEY: "test-secret-key-for-ci-only-not-production-use-min-50-chars"
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_smsproject
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          CACHE_URL: redis://localhost:6379/1
          MOCK_DAISY_SMS: "true"
          DAISY_SMS_API_KEY: "fake-key-for-testing"
        run: python manage.py makemigrations --check --dry-run
      
      - name: Run migrations
        env:
          DEBUG: "True"
          SECRET_KEY: "test-secret-key-for-ci-only-not-production-use-min-50-chars"
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_smsproject
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          CACHE_URL: redis://localhost:6379/1
          MOCK_DAISY_SMS: "true"
          DAISY_SMS_API_KEY: "fake-key-for-testing"
        run: python manage.py migrate --verbosity=2
      
      - name: Run tests
        env:
          DEBUG: "True"
          SECRET_KEY: "test-secret-key-for-ci-only-not-production-use-min-50-chars"
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_smsproject
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          CACHE_URL: redis://localhost:6379/1
          MOCK_DAISY_SMS: "true"
          DAISY_SMS_API_KEY: "fake-key-for-testing"
        run: |
          pytest --cov=apps --cov-report=xml --cov-report=term-missing -v || \
          python manage.py test --verbosity=2
      
      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # =============================================================================
  # JOB 3: Build Docker Image
  # =============================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Test Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:test .
          docker run --rm ${{ env.DOCKER_IMAGE }}:test python manage.py check --deploy || true

  # =============================================================================
  # JOB 4: Deploy to Production (Self-Hosted)
  # =============================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/smsproject' }}
            
            # Pull latest code
            git pull origin main || git pull origin master
            
            # Build and restart containers
            docker compose down
            docker compose build --no-cache
            docker compose up -d
            
            # Wait for services to be healthy
            sleep 10
            
            # Run migrations
            docker compose exec -T web python manage.py migrate --noinput
            
            # Collect static files
            docker compose exec -T web python manage.py collectstatic --noinput
            
            # Show status
            docker compose ps
            
            # Clean up old images
            docker image prune -f
      
      - name: Health check
        run: |
          sleep 15
          curl -f ${{ secrets.HEALTH_CHECK_URL || 'http://localhost:8000/health/' }} || echo "Health check skipped"
        continue-on-error: true
      
      - name: Notify deployment success
        if: success()
        run: echo "Deployment successful!"
      
      - name: Notify deployment failure
        if: failure()
        run: echo "Deployment failed!"
