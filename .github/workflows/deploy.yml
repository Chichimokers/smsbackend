name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy SMS Project
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          DEBUG=True
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
          DB_ENGINE=django.db.backends.postgresql
          DB_NAME=smsproject
          DB_USER=postgres
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=db
          DB_PORT=5432
          DAISY_SMS_API_KEY=${{ secrets.DAISY_SMS_API_KEY }}
          DAISY_SMS_API_URL=https://daisysms.com/stubs/handler_api.php
          CACHE_URL=redis://redis:6379/1
          MOCK_DAISY_SMS=false
          DEFAULT_EXCHANGE_RATE_CUP_PER_USD=4800
          EOF
      
      - name: Stop and remove all containers
        run: |
          docker-compose down --remove-orphans || true
          docker rm -f sms_web sms_db sms_redis 2>/dev/null || true
      
      - name: Build all containers
        run: docker-compose build
      
      - name: Start database and redis
        run: docker-compose up -d db redis
      
      - name: Wait for database to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          sleep 15
          until docker-compose exec -T db pg_isready -U postgres; do
            sleep 3
          done
          echo "PostgreSQL ready!"
      
      - name: Run migrations and setup
        run: |
          echo "=== Creating migrations ==="
          docker-compose run --rm web python manage.py makemigrations users --noinput
          docker-compose run --rm web python manage.py makemigrations accounts --noinput
          docker-compose run --rm web python manage.py makemigrations rentals --noinput
          docker-compose run --rm web python manage.py makemigrations services --noinput
          
          echo "=== Applying migrations ==="
          docker-compose run --rm web python manage.py migrate --noinput
          
          echo "=== Creating superuser ==="
          docker-compose run --rm web python manage.py shell -c "
          from apps.users.models import User
          if not User.objects.filter(email='admin@admin.com').exists():
              User.objects.create_superuser(email='admin@admin.com', password='admin')
              print('Superuser created: admin@admin.com / admin')
          else:
              print('Superuser already exists')
          "
          
          echo "=== Collecting static files ==="
          docker-compose run --rm web python manage.py collectstatic --noinput
      
      - name: Start web server
        run: |
          docker-compose up -d web
          sleep 5
      
      - name: Verify deployment
        run: |
          echo "=== Container Status ==="
          docker-compose ps
          echo ""
          echo "=== Web Logs ==="
          docker-compose logs --tail=30 web
