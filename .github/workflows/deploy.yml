name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy SMS Project
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          DEBUG=False
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
          DB_ENGINE=django.db.backends.postgresql
          DB_NAME=smsproject
          DB_USER=postgres
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_HOST=db
          DB_PORT=5432
          DAISY_SMS_API_KEY=${{ secrets.DAISY_SMS_API_KEY }}
          DAISY_SMS_API_URL=https://daisysms.com/stubs/handler_api.php
          CACHE_URL=redis://redis:6379/1
          MOCK_DAISY_SMS=false
          DEFAULT_EXCHANGE_RATE_CUP_PER_USD=4800
          EOF

      
      - name: Start only database and redis first
        run: docker-compose up -d db redis
      
      - name: Wait for database to be ready
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          sleep 10
          until docker-compose exec -T db pg_isready -U postgres; do
            echo "PostgreSQL not ready yet, waiting..."
            sleep 2
          done
          echo "PostgreSQL is ready!"
      
      - name: Build web container
        run: docker-compose build web
      
      - name: Create migrations for all apps
        run: |
          echo "Generating migrations inside container..."
          docker-compose run --rm web python manage.py makemigrations users --noinput
          docker-compose run --rm web python manage.py makemigrations accounts --noinput
          docker-compose run --rm web python manage.py makemigrations rentals --noinput
          docker-compose run --rm web python manage.py makemigrations services --noinput
      
      - name: Run migrations
        run: |
          echo "Applying all migrations..."
          docker-compose run --rm web python manage.py migrate --noinput
      
      - name: Create superuser admin
        run: |
          echo "Creating superuser admin..."
          docker-compose run --rm web python manage.py shell -c "
          from apps.users.models import User
          if not User.objects.filter(email='admin@admin.com').exists():
              User.objects.create_superuser(email='admin@admin.com', password='admin')
              print('Superuser created: admin@admin.com / admin')
          else:
              print('Superuser already exists')
          "
      
      - name: Collect static files
        run: docker-compose run --rm web python manage.py collectstatic --noinput
      
      - name: Start web container
        run: docker-compose up -d web
      
      - name: Wait for web to be healthy
        run: sleep 10
      
      - name: Show status
        run: |
          docker-compose ps
          echo "---"
          echo "Checking web container logs:"
          docker-compose logs --tail=20 web
